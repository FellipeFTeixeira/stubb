x-dev-healthcheck: &dev-healthcheck
  start_period: 60s
  start_interval: 1s
  interval: 10s
  timeout: 5s
  retries: 10

services:
  write-service:
    image: stubb-write-service:dev
    build:
      target: dev
    command: ['pnpm', '--filter', '@stubb/write-service', 'start:dev']
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: ./apps/write-service/src
          target: /usr/src/app/apps/write-service/src
        - action: rebuild
          path: ./libs/contracts/src
        - action: rebuild
          path: ./apps/write-service/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  read-service:
    image: stubb-read-service:dev
    build:
      target: dev
    command: ['pnpm', '--filter', '@stubb/read-service', 'start:dev']
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: ./apps/read-service/src
          target: /usr/src/app/apps/read-service/src
        - action: rebuild
          path: ./libs/contracts/src
        - action: rebuild
          path: ./apps/read-service/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  projector:
    image: stubb-projector:dev
    build:
      target: dev
    command: ['pnpm', '--filter', '@stubb/projector', 'start:dev']
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: ./apps/projector/src
          target: /usr/src/app/apps/projector/src
        - action: rebuild
          path: ./libs/contracts/src
        - action: rebuild
          path: ./apps/projector/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    image: stubb-web:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ['pnpm', '--filter', '@stubb/web', 'dev']
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /usr/src/app/apps/web/src
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/index.html
        - action: rebuild
          path: ./libs/contracts/src
        - action: rebuild
          path: ./pnpm-lock.yaml

  gateway:
    image: stubb-gateway:dev
    build:
      target: gateway-dev
    depends_on:
      web:
        condition: service_healthy

  kafbat:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - '8081:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: stubb
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    depends_on:
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
